[project]
name = "snap-url-shortener"
version = "1.0.0"
description = "Snap — a URL shortener with click analytics on Vercel serverless."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "asyncpg==0.31.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]